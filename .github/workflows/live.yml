name: Live-stilling
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Følg kamper som pågår
        run: python3 scripts/live.py index.html
        env:
          LIVE_TOKEN: ${{ secrets.LIVE_TOKEN }}
