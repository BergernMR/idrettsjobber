name: Oppdater kamper og tabeller
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oppdater
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent terminlisten til Norges Ishockeyforbund (live.hockey.no)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          npm i --silent --prefix /tmp/pw playwright@1.48.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium > /dev/null
          NODE_PATH=/tmp/pw/node_modules node scripts/hockey_no.js
      - name: Hent nye kamper og tabeller
        run: python3 scripts/update_data.py index.html
      - name: Hent verdenscup og VM i vintersport (FIS og IBU)
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/winter.py index.html
      - name: Hent kampstatistikk for spilte kamper
        run: python3 scripts/match_stats.py index.html
      - name: Sjekk at siden fortsatt er gyldig
        run: |
          awk '/<script>/{f=1;next}/<\/script>/{f=0}f' index.html > /tmp/chk.js
          node --check /tmp/chk.js
      - name: Lagre endringer
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Ingen endringer"; exit 0; fi
          git config user.name "aurora-oppdatering"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Oppdater kamper og tabeller"
          for i in 1 2 3; do
            if git pull --rebase -q; then git push && exit 0
            else
              # Noen andre endret de samme linjene mens denne kjøringen pågikk (f.eks. en ny versjon av siden).
              # Dataene hentes på nytt neste time, så denne runden hoppes over i stedet for å feile.
              git rebase --abort || true
              echo "Konflikt med nyere endringer på main, hopper over denne oppdateringen"; exit 0
            fi
            sleep 10
          done; exit 1
