name: Oppdater kamper, tabeller, nyheter og jobber
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oppdater
  cancel-in-progress: false
jobs:
  oppdater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent nye kamper og tabeller
        run: python3 scripts/update_data.py index.html
      - name: Hent verdenscup og VM i vintersport (FIS og IBU)
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/winter.py index.html
      - name: Hent kampstatistikk for spilte kamper
        run: python3 scripts/match_stats.py index.html
      - name: Hent ferske sportsnyheter til forsiden
        run: python3 scripts/gnews_rss.py index.html
      - name: Hent klubbnyheter fra de siste 3 dagene (lokalaviser, NRK, SVT, Yle m.fl.)
        env:
          BING_PER_RUN: "150"
        run: python3 scripts/club_news.py index.html
      - name: Hent nye idrettsjobber
        run: python3 scripts/jobs_fetch.py index.html
      - name: Finn bilder til forsidenyhetene
        run: python3 scripts/news_images.py index.html
      - name: Sjekk at siden fortsatt er gyldig
        run: |
          awk '/<script>/{f=1;next}/<\/script>/{f=0}f' index.html > /tmp/chk.js
          node --check /tmp/chk.js
      - name: Lagre endringer
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Ingen endringer"; exit 0; fi
          git config user.name "aurora-oppdatering"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Oppdater kamper, tabeller, nyheter og jobber"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 10; done; exit 1
